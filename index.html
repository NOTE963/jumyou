<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暴露ゲーム1</title>
<style>
:root{--bg:#f7f3f0;--card:#fffdfb;--ink:#2a2125;--sub:#8b7c82;--acc:#a8324f;--line:#e6dcd8;--soft:#f1e8e5;--serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
@media (prefers-color-scheme:dark){:root{--bg:#18131a;--card:#221b24;--ink:#f3eaee;--sub:#a8969f;--acc:#e5748f;--line:#3a2f3a;--soft:#2c222d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{width:100%;max-width:460px;padding:34px 22px 40px}
.eyebrow{text-align:center;font-size:11px;font-weight:700;letter-spacing:.34em;color:var(--acc)}
h1{font-family:var(--serif);font-size:32px;text-align:center;margin:12px 0 0;letter-spacing:.1em;font-weight:700}
.rule{width:34px;height:2px;background:var(--acc);margin:18px auto}
.sub{text-align:center;color:var(--sub);font-size:13px;line-height:1.8;margin:0 0 22px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--sub);margin:22px 0 8px}
input{width:100%;padding:14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:none;transition:border-color .2s}
input:focus{border-color:var(--acc)}
button{font-family:inherit;cursor:pointer;transition:opacity .2s,transform .1s}
button:active{transform:scale(.98)}
.main{width:100%;margin-top:16px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.16em;border:0;border-radius:10px;background:var(--ink);color:var(--bg)}
.main:disabled{opacity:.3;cursor:default}
.ghost{width:100%;margin-top:12px;padding:14px;font-size:13px;letter-spacing:.1em;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.hide{display:none}
.code{font-family:var(--serif);text-align:center;font-size:50px;letter-spacing:.3em;padding:10px 0 10px .3em;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:10px 0 0}
.list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0}
.pl{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.pl b{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px}
.pl.h::after{content:"HOST";font-size:9px;letter-spacing:.14em;color:var(--acc);font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px 24px;margin-top:14px;box-shadow:0 14px 34px rgba(70,30,45,.07)}
.lab{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--sub);margin-bottom:14px}
#topic{font-family:var(--serif);font-size:19px;line-height:1.85;min-height:112px;display:flex;align-items:center;font-weight:600;transition:opacity .15s,filter .15s}
#topic.spin{opacity:.35;filter:blur(2px)}
#pick{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--acc);min-height:58px;letter-spacing:.06em;transition:opacity .15s}
#pick.spin{opacity:.3}
.pop{animation:pop .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
#msg{font-family:var(--serif);text-align:center;font-size:15px;line-height:1.8;margin-top:20px;min-height:28px}
.hint{text-align:center;font-size:12px;color:var(--sub);line-height:1.8;margin-top:14px}
.cnt{text-align:center;font-size:11px;letter-spacing:.08em;color:var(--sub);margin-top:26px;line-height:1.9}
#vote .opt{display:block;width:100%;padding:16px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.6}
#vote .opt.sel{border-color:var(--acc);background:var(--soft);color:var(--acc)}
.res{margin-top:10px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.res.win{border-color:var(--acc)}
.rtop{display:flex;justify-content:space-between;gap:10px;font-family:var(--serif);font-weight:600;font-size:15px}
.rc{color:var(--acc);white-space:nowrap}
.bar{height:6px;background:var(--soft);border-radius:3px;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .6s}
.rn2{font-size:12px;color:var(--sub);line-height:1.7}
#sayTa{display:block;width:100%;padding:14px;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);resize:none;outline:none;margin-top:10px}
#sayTa:focus{border-color:var(--acc)}
.ans{padding:14px 16px;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.an{font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.1em;margin-bottom:6px}
.at{font-family:var(--serif);font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
#drCv{display:block;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none;margin-top:10px}
#drTm{font-family:var(--serif);font-size:28px;text-align:center;color:var(--acc);letter-spacing:.1em}
.tools{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:2px solid var(--acc);outline-offset:2px}
.tl{padding:8px 12px;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px}
img.dr{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;display:block}
</style>
</head>
<body>
<main>
<section id="home">
<div class="eyebrow">GAME 01</div>
<h1>暴露ゲーム1</h1>
<div class="rule"></div>
<p class="sub">ルーレットで決まったお題に、ルーレットで選ばれた人が<br>本音で答えるゲーム</p>
<label>あなたの名前</label>
<input id="name" maxlength="10" placeholder="例：あや">
<button class="main" id="create">ルームを作る</button>
<label>ルーム番号で参加</label>
<input id="codeIn" inputmode="numeric" maxlength="4" placeholder="4桁の番号">
<button class="ghost" id="join">参加する</button>
<div id="err" style="color:#c0392b;text-align:center;margin-top:14px;font-size:13px"></div>
</section>

<section id="room" class="hide">
<div class="eyebrow">ROOM</div>
<div class="code" id="code"></div>
<div class="list" id="players"></div>
<div id="game" class="hide">
<div class="box"><div class="lab"><span>TOPIC</span><span id="rn"></span></div><div id="topic"></div></div>
<div class="box" id="pickBox"><div class="lab"><span>ANSWERER</span></div><div id="pick"></div></div>
<div id="vote" class="hide"></div>
<div id="msg"></div>
<div class="hint">名前を聞かれたときは、フルネーム・下の名前・イニシャル・あだ名のどれでもOK</div>
</div>
<div id="wait" class="sub"></div>
<button class="main" id="draw">ゲームスタート</button>
<button class="ghost" id="leave">退出する</button>
<div class="cnt">収録お題 <span id="total"></span> 通り<br>全員が抜けるとルームは削除されます</div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ===== お題を組み合わせで生成（2000通り以上） =====
var set={},TOPICS=[];
function add(t){if(!set[t]){set[t]=1;TOPICS.push(t)}}
function each(a,b,f){a.forEach(function(x){b.forEach(function(y){add(f(x,y))})})}
function pairs(l,f){for(var i=0;i<l.length;i++)for(var j=i+1;j<l.length;j++)add(f(l[i],l[j]))}

// 1) 範囲 × 人物の条件
var SC=["今のクラスで","学年全体で","部活で","同じ塾や習い事で","小学校の同級生の中で","今までに出会った人の中で","この学校全体で","先輩の中で","後輩の中で","自分の周りで","友達グループの中で","この部屋のメンバーの中で","委員会や係の中で","他のクラスで","今まで同じクラスだった人の中で","通学路で見かける人の中で","部活の同級生の中で","幼なじみの中で"];
var AT=["一番優しいと思う人","一番かっこいい・かわいいと思う人","一番笑顔が素敵な人","一番面白い人","一番モテそうな人","一番ピュアそうな人","一番告白が上手そうな人","一番尽くしてくれそうな人","一番ヤキモチを焼きそうな人","一番恋愛経験が多そうな人","一番恋愛に奥手そうな人","付き合ってみたい人","告白されたらOKしそうな人","一緒に帰りたい人","席が隣になったらうれしい人","LINEが来たらうれしい人","なんとなく目で追ってしまう人","話すと緊張する人","相談したら親身に聞いてくれそうな人","一緒にいて一番落ち着く人","一緒に文化祭を回りたい人","修学旅行で同じ班になりたい人","ちょっと気になっている人","実は意識している人","友達に紹介したい人","守ってあげたくなる人","頼りにしている人","憧れている人","勉強を教えてもらいたい人","手作りのお菓子をあげたい人","誕生日を祝いたい人","名前を呼ばれたらドキッとする人","笑わせたい人","一番話しやすい人","一番ギャップがありそうな人","将来大物になりそうな人","一番努力家だと思う人","一番センスがいいと思う人","一番声がいいと思う人","一番字がきれいな人","一番運動神経がいいと思う人","一番頭がいいと思う人","一番おしゃれだと思う人","一番天然だと思う人","一番聞き上手だと思う人","一番気配りができる人","一番頼りになる人","一番クールな人","密かに応援している恋の相手","友達に取られたくない人"];
each(SC,AT,function(s,a){return s+"、"+a+"の名前を暴露して"});

// 2) 経験した相手 × 答え方
var TG=["初恋の人","今の好きな人","前に好きだった人","一番最近ドキドキした相手","告白しようか迷っている人","告白されたことがある相手","気になっている先輩","気になっている後輩","片思い中の人","憧れている人","友達に隠している気になる人","最初に好きになった人","一番長く片思いした人","一番ドキッとさせられた人","勇気を出して話しかけた相手","連絡先を聞いた相手","手紙を書いた相手","プレゼントを渡した相手","一緒に帰ったことがある人","好きバレしてしまった相手","友達と好きな人がかぶった相手","恋愛相談をされた相手","恋愛相談をした相手","夢に出てきた人","ヤキモチを焼いた相手","目が合ってそらしてしまった人","話しかけられてうれしかった人","名前を呼ばれてドキッとした人","笑顔にやられた人","勉強を教えてもらった人","傘に入れてもらった人","席替えで隣になった人","同じ班になってうれしかった人","部活の応援に行った相手","バレンタインを渡したい人","誕生日を祝った人","周りに冷やかされた相手","噂になったことがある相手","友達に紹介したい人"];
var ST=["フルネームで","下の名前だけで","イニシャルで","あだ名で","ヒントを出しながら","頭文字と特徴をひとつ添えて"];
each(TG,ST,function(t,s){return t+"の名前を"+s+"暴露して"});

// 3) 時期 × 人物
var TM=["小学校低学年の頃","小学校高学年の頃","中1になったばかりの頃","中1の秋","中2の春","中2の夏","中2の冬","中3になった頃","受験を意識し始めた頃","体育祭の頃","文化祭の頃","修学旅行の頃","夏休み前","冬休み前","バレンタインの頃","去年の今ごろ","今年の春","先月","先週","クラス替えの頃","席替えの頃","部活に入ったばかりの頃","遠足の頃","合唱コンクールの頃"];
var TV=["好きだった人","気になっていた人","目で追っていた人","話しかけたかった人","仲良くなりたかった人","告白しようと思った人","ヤキモチを焼いた相手","一番ドキドキした相手","連絡を待っていた相手","一緒に帰りたかった人","ひそかに憧れていた人","友達に隠していた気になる人"];
each(TM,TV,function(t,v){return t+"、"+v+"の名前を暴露して"});

// 4) もしも〜なら誰と
var WS=["席替えで隣になるなら","修学旅行で同じ班になるなら","文化祭を一緒に回るなら","一緒に帰るなら","日直を組むなら","体育祭で二人三脚をするなら","フォークダンスを踊るなら","花火大会に行くなら","初詣に行くなら","映画を見に行くなら","遊園地に行くなら","水族館に行くなら","勉強を教えてもらうなら","部活の応援に来てほしいなら","電話で話すなら","誕生日を祝ってほしいなら","手作りのお菓子をもらうなら","手紙をもらうなら","告白されるなら","隣で給食を食べるなら","お弁当を作ってもらうなら","相合傘をするなら","写真を一緒に撮るなら","悩みを相談するなら","卒業式に会いたいなら","同窓会で再会したいなら","自習中に隣にいてほしいなら","一緒に委員会をするなら","一緒に掃除当番をするなら","同じ係になるなら","グループ発表を組むなら","席が前後になるなら","放課後に残って話すなら","図書館で一緒に勉強するなら","夏祭りに行くなら","一緒にカラオケに行くなら","自転車で一緒に帰るなら","遠足でお弁当を食べるなら","バスで隣に座るなら","肝試しのペアを組むなら","キャンプで同じ班になるなら","風邪のお見舞いに来てほしいなら","誕生日プレゼントを選ぶなら","クリスマスに会うなら","試合を見に来てほしいなら","ペアで調理実習をするなら","学級委員を一緒にやるなら","合唱コンクールで隣に並ぶなら"];
var WX=["一番に思い浮かぶ人の名前を暴露して","誰とがいいか名前を暴露して。理由もひとこと","本命とダークホース、2人の名前を暴露して","候補を3人、名前で暴露して","相手の名前をイニシャルで暴露して","相手の名前をあだ名で暴露して","ヒントを出しながら名前を暴露して","思い浮かんだ人の下の名前を暴露して"];
each(WS,WX,function(w,x){return w+"、"+x});

// 5) タイプ二択 × 名前
var TY=["優しい人","面白い人","頭がいい人","運動ができる人","おしゃれな人","笑顔が素敵な人","声がいい人","字がきれいな人","しっかりしている人","天然な人","気配りができる人","誰にでも平等な人","ちょっとクールな人","明るい人","真面目な人","絵や音楽が得意な人","背が高い人","聞き上手な人","話しやすい人","努力家な人","頼りになる人","守ってあげたくなる人","ミステリアスな人","素直な人","負けず嫌いな人","責任感のある人","少しシャイな人","静かで落ち着いた人"];
pairs(TY,function(a,b){return "「"+a+"」と「"+b+"」、付き合うならどっち？そのタイプで思い浮かぶ人の名前を暴露して"});
pairs(TY,function(a,b){return "「"+a+"」と「"+b+"」、告白されたらOKしやすいのはどっち？そのタイプの知り合いの名前を暴露して"});
pairs(TY,function(a,b){return "「"+a+"」と「"+b+"」、一緒にいて落ち着くのはどっち？そのタイプで思い浮かぶ人の名前を暴露して"});

// 6) 場所・過ごし方の二択 × 名前
var PL=["遊園地","水族館","動物園","映画館","図書館","カフェ","ショッピングモール","公園","花火大会","夏祭り","カラオケ","ゲームセンター","ボウリング","海","プール","美術館","プラネタリウム","初詣","イルミネーション","本屋","スイーツのお店","科学館","動物カフェ","ピクニック"];
pairs(PL,function(a,b){return "「"+a+"」と「"+b+"」、デートで行きたいのはどっち？一緒に行きたい人の名前を暴露して"});
var AC=["一緒に帰る","一緒に勉強する","ゲームをする","カラオケに行く","映画を見る","買い物に行く","散歩する","お祭りに行く","写真を撮る","ごはんを食べる","電話で話す","部活を見学する","図書館で過ごす","公園で話す"];
pairs(AC,function(a,b){return "放課後は「"+a+"」と「"+b+"」、どっちをしたい？一緒にしたい人の名前を暴露して"});

// 7) タイプ系
var TP=["好きなタイプ","苦手なタイプ","理想の恋人","初恋の人","今の好きな人"];
var TA=["性格","顔の系統","髪型","身長","声","話し方","笑い方","服装","雰囲気","趣味","得意なこと","仕草","口ぐせ","年齢（年上・年下・同い年）","目","歩き方","第一印象","良いところ","気になるところ","名前の響き"];
each(TP,TA,function(p,a){return p+"の"+a+"は？"});
var LV=["尽くすタイプ","尽くされたいタイプ","追いかけるタイプ","追いかけられたいタイプ","一途なタイプ","気が多いタイプ","甘えたいタイプ","甘えられたいタイプ","連絡マメなタイプ","連絡ゆるいタイプ","ひとりの時間が大事なタイプ","ずっと一緒にいたいタイプ","自分から告白する派","告白される派","友達から恋人になる派","一目惚れ派","ヤキモチ焼きなタイプ","気持ちを隠すタイプ","ストレートに伝えるタイプ","照れ屋なタイプ"];

 var er=el("button","tl","消しゴム");er.onclick=function(){col="#ffffff";wd=22};tools.appendChild(er);
 var cl=el("button","tl","全消し");cl.onclick=function(){if(locked)return;ctx.fillStyle="#fff";ctx.fillRect(0,0,W,W)};tools.appendChild(cl);
 box.appendChild(tools);
 var sb=el("button","opt","描き終わった（提出）");box.appendChild(sb);
 var ct=el("div","hint","");ct.id="drCnt";box.appendChild(ct);
 function submit(){if(sent)return;sent=true;locked=true;clearInterval(iv);
  if(roomRef)roomRef.child("draws/"+me).set(cv.toDataURL("image/jpeg",0.6));
  sb.textContent="提出済み";sb.disabled=true;tm.textContent="提出しました"}
 sb.onclick=submit;
 function tick(){tm.textContent="残り "+left+" 秒";if(left<=0)submit();left--}
 var iv=setInterval(tick,1000);timers.push(iv);tick();
}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function advance(){var rd=data.round,ids=Object.keys(data.players||{});
 if(rd.type==="say"||rd.type==="draw")roomRef.child("round").update({order:shuf(ids),shown:1});else roomRef.child("round/reveal").set(true)}
function renderVote(){
 var rd=data&&data.round,box=$("vote"),T=rd&&rd.type;
 if(!rd||(T!=="vote"&&T!=="pvote"&&T!=="say"&&T!=="draw")||!voteReady){box.classList.add("hide");return}
 var ps=data.players||{},ids=Object.keys(ps),vs=data.votes||{},an=(T==="draw"?data.draws:data.answers)||{};
 var src=(T==="say"||T==="draw")?an:vs,done=ids.filter(function(i){return src[i]!==undefined}).length;
 var started=(T==="say"||T==="draw")?!!rd.order:!!rd.reveal;
 if(isHost&&!started&&ids.length>1&&done>=ids.length){advance();return}
 box.classList.remove("hide");
 if(T==="draw"&&!started){
  if(box.dataset.k!=="draw"+rd.n){box.dataset.k="draw"+rd.n;box.innerHTML="";buildCanvas(box)}
  var dc=$("drCnt");if(dc)dc.textContent="提出済み "+done+" / "+ids.length;
  $("msg").textContent="全員が提出すると、一人ずつ公開されます";
  return}
 if(T==="say"&&!started){
  if(box.dataset.k!=="say"+rd.n){box.dataset.k="say"+rd.n;box.innerHTML="";
   var ta=el("textarea");ta.id="sayTa";ta.maxLength=80;ta.rows=3;ta.placeholder="あなたならどうする？（80文字まで）";ta.value=an[me]||"";box.appendChild(ta);
   var sb=el("button","opt","回答を送信");sb.onclick=function(){var v=ta.value.trim();if(!v)return;roomRef.child("answers/"+me).set(v);sb.textContent="送信済み（もう一度押すと修正できます）"};box.appendChild(sb);
   var ct=el("div","hint","");ct.id="sayCnt";box.appendChild(ct)}
  $("sayCnt").textContent="回答済み "+done+" / "+ids.length;
  $("msg").textContent="全員が送信すると、一人ずつ公開されます";
  return}
 box.dataset.k="";box.innerHTML="";
 function row(label,n,tot,names,win){var w=el("div","res"+(win?" win":"")),top=el("div","rtop");
  top.appendChild(el("span","",label));top.appendChild(el("span","rc",n+"票"));w.appendChild(top);
  var bar=el("div","bar"),f=el("i");f.style.width=Math.round(n/tot*100)+"%";bar.appendChild(f);w.appendChild(bar);
  w.appendChild(el("div","rn2",names||"なし"));box.appendChild(w)}
 function nm(list){return list.map(function(id){return ps[id].name}).join("、")}
 if(T==="vote"){
  var opts=[rd.a,rd.b];
  if(!started){
   opts.forEach(function(o,i){var b=el("button","opt"+(vs[me]===i?" sel":""),o);b.onclick=function(){roomRef.child("votes/"+me).set(i)};box.appendChild(b)});
   box.appendChild(el("div","hint","投票済み "+done+" / "+ids.length+(vs[me]===undefined?"　どちらかを選んでください":"　他の人を待っています（選び直せます）")));
   $("msg").textContent="全員で多数決";
  }else{
   var c=[0,0];ids.forEach(function(id){if(vs[id]!==undefined)c[vs[id]]++});
   var tot=(c[0]+c[1])||1;
   opts.forEach(function(o,i){row(o,c[i],tot,nm(ids.filter(function(id){return vs[id]===i})),c[i]>c[1-i])});
   $("msg").textContent=c[0]===c[1]?"同票でした":(c[0]>c[1]?rd.a:rd.b)+" が多数派です";
  }
 }else if(T==="pvote"){
  if(!started){
   ids.forEach(function(id){var b=el("button","opt"+(vs[me]===id?" sel":""),ps[id].name+(id===me?"（自分）":""));b.onclick=function(){roomRef.child("votes/"+me).set(id)};box.appendChild(b)});
   box.appendChild(el("div","hint","投票済み "+done+" / "+ids.length+(vs[me]===undefined?"　メンバーから1人選んでください":"　他の人を待っています（選び直せます）")));
   $("msg").textContent="この中から1人を指名";
  }else{
   var cnt={},all=0;ids.forEach(function(id){cnt[id]=0});
   ids.forEach(function(id){var t=vs[id];if(t!==undefined&&cnt[t]!==undefined){cnt[t]++;all++}});
   var sorted=ids.slice().sort(function(a,b){return cnt[b]-cnt[a]}),mx=cnt[sorted[0]]||0;
   sorted.forEach(function(id){row(ps[id].name,cnt[id],all||1,nm(ids.filter(function(v){return vs[v]===id})),mx>0&&cnt[id]===mx)});
   var tops=sorted.filter(function(id){return mx>0&&cnt[id]===mx});
   $("msg").textContent=!tops.length?"投票がありませんでした":(tops.length>1?nm(tops)+" が同票で1位です":nm(tops)+" さんが1位です");
  }
 }else{
  var ord=rd.order,sh=Math.min(rd.shown||0,ord.length);
  box.appendChild(el("div","hint","回答 "+sh+" / "+ord.length));
  for(var k=sh-1;k>=0;k--){var id=ord[k],cd=el("div","ans"+(k===sh-1?" pop":""));
   cd.appendChild(el("div","an",ps[id]?ps[id].name:"（退出）"));
   if(T==="draw"&&an[id]){var im=el("img","dr");im.src=an[id];cd.appendChild(im)}else cd.appendChild(el("div","at",an[id]!==undefined&&an[id]!==""?an[id]:(T==="draw"?"（未提出）":"（未回答）")));box.appendChild(cd)}
  $("msg").textContent=sh>=ord.length?"全員分が出そろいました":"";
 }
}
function play(r,names){
 timers.forEach(clearTimeout);timers.forEach(clearInterval);timers=[];busy=true;voteReady=false;$("draw").disabled=true;
 var isV=(r.type==="vote"||r.type==="pvote"||r.type==="say"||r.type==="draw");
 $("game").classList.remove("hide");$("rn").textContent="第"+r.n+"問"+({vote:"　多数決",pvote:"　指名投票",say:"　全員回答",draw:"　お絵かき"})[r.type]||"";$("msg").textContent="";
 $("vote").classList.add("hide");$("vote").dataset.k="";$("pickBox").classList.toggle("hide",isV);
 $("topic").classList.remove("pop");$("pick").classList.remove("pop");$("pick").textContent="";
 $("topic").classList.add("spin");$("pick").classList.remove("spin");
 var i1=setInterval(function(){$("topic").textContent=TOPICS[Math.floor(Math.random()*TOPICS.length)]},70);timers.push(i1);
 timers.push(setTimeout(function(){clearInterval(i1);$("topic").classList.remove("spin");$("topic").textContent=r.topic;void $("topic").offsetWidth;$("topic").classList.add("pop");
  if(isV){busy=false;voteReady=true;$("draw").disabled=!data||Object.keys(data.players||{}).length<2;renderVote();return}
  $("pick").classList.add("spin");
  var i2=setInterval(function(){$("pick").textContent=names[Math.floor(Math.random()*names.length)]},80);timers.push(i2);
  timers.push(setTimeout(function(){clearInterval(i2);$("pick").classList.remove("spin");$("pick").textContent=r.name;void $("pick").offsetWidth;$("pick").classList.add("pop");
   $("msg").textContent=r.name+" さん、答えてください";busy=false;if(data)$("draw").disabled=Object.keys(data.players||{}).length<2},2400));
 },2600));
}
