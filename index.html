<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 同時視聴ルーム</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0f0f0f;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ========== ルーム選択画面 ========== */
        .room-selection {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            gap: 20px;
        }

        .room-selection h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group label {
            font-size: 14px;
            color: #aaa;
            font-weight: 500;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input::placeholder {
            color: #666;
        }

        .button-group {
            width: 100%;
            max-width: 300px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #ff0000;
            color: #fff;
        }

        .btn-primary:hover {
            background: #cc0000;
        }

        .btn-secondary {
            background: #333;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #444;
        }

        /* ========== ルーム内画面 ========== */
        .room-view {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #0f0f0f;
        }

        .room-header {
            background: #1a1a1a;
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .room-info {
            font-size: 12px;
            color: #aaa;
        }

        .room-info strong {
            color: #fff;
        }

        .room-header-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-small:hover {
            background: #444;
        }

        .btn-small.danger {
            background: #ff0000;
        }

        .btn-small.danger:hover {
            background: #cc0000;
        }

        .content-area {
            display: flex;
            flex: 1;
            gap: 0;
            min-height: 0;
        }

        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            overflow-y: auto;
        }

        #player {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-input-section {
            padding: 0 10px 10px;
            display: flex;
            gap: 8px;
        }

        .video-input-section input {
            flex: 1;
            padding: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }

        .video-input-section button {
            padding: 8px 12px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* ========== コメント欄（YouTube） ========== */
        .comments-section {
            width: 300px;
            background: #1a1a1a;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .comments-header {
            padding: 12px;
            border-bottom: 1px solid #333;
            font-size: 14px;
            font-weight: 600;
        }

        .comments-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .youtube-comments-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ========== ユーザーリスト ========== */
        .users-section {
            width: 250px;
            background: #1a1a1a;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .users-header {
            padding: 12px;
            border-bottom: 1px solid #333;
            font-size: 14px;
            font-weight: 600;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .user-item {
            padding: 10px;
            background: #262626;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff00;
        }

        /* ========== レスポンシブ ========== */
        @media (max-width: 1024px) {
            .comments-section {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .users-section {
                display: none;
            }
            
            .content-area {
                flex-direction: column;
            }

            .comments-section {
                display: flex;
                width: 100%;
                height: 200px;
                border-left: none;
                border-top: 1px solid #333;
            }

            #player {
                aspect-ratio: auto;
                height: 200px;
            }
        }

        .loader {
            text-align: center;
            padding: 20px;
        }

        .error {
            color: #ff0000;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ルーム選択画面 -->
        <div class="room-selection" id="roomSelection">
            <h1>🎥 YouTube 同時視聴</h1>
            
            <div class="form-group">
                <label for="usernameInput">ユーザーネーム</label>
                <input 
                    type="text" 
                    id="usernameInput" 
                    placeholder="あなたのユーザーネーム"
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label for="roomIdInput">ルームID</label>
                <input 
                    type="text" 
                    id="roomIdInput" 
                    placeholder="room_name または 新しいID"
                    autocomplete="off"
                >
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="app.createRoom()">ルーム作成</button>
                <button class="btn-secondary" onclick="app.joinRoom()">参加する</button>
            </div>

            <div id="roomSelectionError" class="error"></div>
        </div>

        <!-- ルーム内画面 -->
        <div class="room-view" id="roomView">
            <div class="room-header">
                <div class="room-info">
                    ルームID: <strong id="roomIdDisplay"></strong> | 
                    ユーザー: <strong id="usernameDisplay"></strong>
                </div>
                <div class="room-header-buttons">
                    <button class="btn-small" onclick="app.leaveRoom()">退出</button>
                    <button class="btn-small danger" onclick="app.deleteAllRooms()">全削除</button>
                </div>
            </div>

            <div class="content-area">
                <!-- ユーザーリスト -->
                <div class="users-section">
                    <div class="users-header">接続中のユーザー</div>
                    <div class="users-list" id="usersList">
                        <div class="loader">読み込み中...</div>
                    </div>
                </div>

                <!-- メイン動画エリア -->
                <div class="video-section">
                    <div class="video-container">
                        <div id="player"></div>
                        
                        <div class="video-input-section">
                            <input 
                                type="text" 
                                id="youtubeUrlInput" 
                                placeholder="YouTubeのURLまたはビデオID"
                                autocomplete="off"
                            >
                            <button onclick="app.updateVideo()">再生</button>
                        </div>
                    </div>
                </div>

                <!-- YouTubeコメント欄 -->
                <div class="comments-section">
                    <div class="comments-header">コメント</div>
                    <div class="comments-container">
                        <iframe 
                            id="commentsFrame"
                            class="youtube-comments-iframe"
                            src=""
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase初期化
        const firebaseConfig = {
            apiKey: "AIzaSyCGkbyKm-ThFB-dA5aeFBAPmwB7aGE0bCE",
            authDomain: "kmtpj-a8f92.firebaseapp.com",
            databaseURL: "https://kmtpj-a8f92-default-rtdb.firebaseio.com",
            projectId: "kmtpj-a8f92",
            storageBucket: "kmtpj-a8f92.firebasestorage.app",
            messagingSenderId: "79749146454",
            appId: "1:79749146454:web:86c5f7cceb3f0b684858f7",
            measurementId: "G-C13R4G84QW"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let player;
        let isPlayerReady = false;
        let isSyncing = false;
        let currentRoomId = null;
        let currentUsername = null;
        let currentUserId = null;

        const app = {
            createRoom() {
                const username = document.getElementById('usernameInput').value.trim();
                const roomId = document.getElementById('roomIdInput').value.trim();

                if (!username) {
                    this.showError('ユーザーネームを入力してください');
                    return;
                }

                if (!roomId) {
                    this.showError('ルームIDを入力してください');
                    return;
                }

                currentUsername = username;
                currentRoomId = roomId;
                currentUserId = this.generateUserId();

                // ルーム情報をFirebaseに保存
                const roomRef = db.ref(`rooms/${roomId}`);
                roomRef.once('value', (snapshot) => {
                    if (snapshot.exists()) {
                        this.showError('このルームIDは既に存在します');
                        return;
                    }

                    roomRef.set({
                        createdAt: firebase.database.ServerValue.TIMESTAMP,
                        currentVideo: null,
                        playbackState: {
                            playing: false,
                            currentTime: 0,
                            lastUpdate: firebase.database.ServerValue.TIMESTAMP
                        }
                    });

                    this.joinRoomView();
                });
            },

            joinRoom() {
                const username = document.getElementById('usernameInput').value.trim();
                const roomId = document.getElementById('roomIdInput').value.trim();

                if (!username) {
                    this.showError('ユーザーネームを入力してください');
                    return;
                }

                if (!roomId) {
                    this.showError('ルームIDを入力してください');
                    return;
                }

                currentUsername = username;
                currentRoomId = roomId;
                currentUserId = this.generateUserId();

                // ルームの存在確認
                const roomRef = db.ref(`rooms/${roomId}`);
                roomRef.once('value', (snapshot) => {
                    if (!snapshot.exists()) {
                        this.showError('このルームは存在しません');
                        return;
                    }

                    this.joinRoomView();
                });
            },

            joinRoomView() {
                document.getElementById('roomSelection').style.display = 'none';
                document.getElementById('roomView').style.display = 'flex';
                document.getElementById('roomIdDisplay').textContent = currentRoomId;
                document.getElementById('usernameDisplay').textContent = currentUsername;

                // ユーザー情報をFirebaseに登録
                const userRef = db.ref(`rooms/${currentRoomId}/users/${currentUserId}`);
                userRef.set({
                    username: currentUsername,
                    joinedAt: firebase.database.ServerValue.TIMESTAMP,
                    lastActive: firebase.database.ServerValue.TIMESTAMP
                });

                // 接続が切れたら自動削除
                userRef.onDisconnect().remove();

                // YouTubeプレイヤー初期化
                if (!isPlayerReady) {
                    this.initYouTubePlayer();
                }

                // ユーザーリスト監視
                this.watchUsersList();

                // 動画情報監視
                this.watchRoomVideo();

                // 再生状態監視
                this.watchPlaybackState();
            },

            initYouTubePlayer() {
                player = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    videoId: 'dQw4w9WgXcQ',
                    events: {
                        'onReady': this.onPlayerReady.bind(this),
                        'onStateChange': this.onPlayerStateChange.bind(this),
                        'onPlaybackRateChange': this.onPlaybackRateChange.bind(this)
                    },
                    playerVars: {
                        controls: 1,
                        modestbranding: 1,
                        rel: 0
                    }
                });
                isPlayerReady = true;
            },

            onPlayerReady(event) {
                console.log('Player Ready');
            },

            onPlayerStateChange(event) {
                if (isSyncing) return;

                const stateMap = {
                    [YT.PlayerState.PLAYING]: 'playing',
                    [YT.PlayerState.PAUSED]: 'paused',
                    [YT.PlayerState.UNSTARTED]: 'stopped'
                };

                const state = stateMap[event.data];
                if (state) {
                    const playbackRef = db.ref(`rooms/${currentRoomId}/playbackState`);
                    playbackRef.update({
                        playing: state === 'playing',
                        currentTime: player.getCurrentTime(),
                        lastUpdate: firebase.database.ServerValue.TIMESTAMP,
                        updatedBy: currentUserId
                    });
                }
            },

            onPlaybackRateChange(event) {
                if (isSyncing) return;
                const playbackRef = db.ref(`rooms/${currentRoomId}/playbackState`);
                playbackRef.update({
                    playbackRate: event.data,
                    lastUpdate: firebase.database.ServerValue.TIMESTAMP
                });
            },

            watchUsersList() {
                const usersRef = db.ref(`rooms/${currentRoomId}/users`);
                usersRef.on('value', (snapshot) => {
                    const usersList = document.getElementById('usersList');
                    usersList.innerHTML = '';

                    if (!snapshot.exists()) {
                        usersList.innerHTML = '<div style="color: #666;">ユーザーがいません</div>';
                        return;
                    }

                    snapshot.forEach((child) => {
                        const user = child.val();
                        const userItem = document.createElement('div');
                        userItem.className = 'user-item';
                        userItem.innerHTML = `
                            <div class="user-dot"></div>
                            <span>${user.username}</span>
                        `;
                        usersList.appendChild(userItem);
                    });
                });
            },

            watchRoomVideo() {
                const videoRef = db.ref(`rooms/${currentRoomId}/currentVideo`);
                videoRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const videoId = snapshot.val();
                        if (player && isPlayerReady) {
                            isSyncing = true;
                            player.loadVideoById(videoId);
                            document.getElementById('youtubeUrlInput').value = videoId;
                            this.updateCommentsFrame(videoId);
                            setTimeout(() => {
                                isSyncing = false;
                            }, 1000);
                        }
                    }
                });
            },

            watchPlaybackState() {
                const playbackRef = db.ref(`rooms/${currentRoomId}/playbackState`);
                playbackRef.on('value', (snapshot) => {
                    if (!snapshot.exists() || !player || !isPlayerReady) return;

                    const state = snapshot.val();
                    if (state.updatedBy === currentUserId) return;

                    isSyncing = true;

                    // 時間の同期
                    const currentTime = player.getCurrentTime();
                    const diff = Math.abs(currentTime - state.currentTime);
                    if (diff > 2) {
                        player.seekTo(state.currentTime);
                    }

                    // 再生状態の同期
                    if (state.playing && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                        player.playVideo();
                    } else if (!state.playing && player.getPlayerState() === YT.PlayerState.PLAYING) {
                        player.pauseVideo();
                    }

                    // 再生速度の同期
                    if (state.playbackRate && player.getPlaybackRate() !== state.playbackRate) {
                        player.setPlaybackRate(state.playbackRate);
                    }

                    setTimeout(() => {
                        isSyncing = false;
                    }, 500);
                });
            },

            updateVideo() {
                const input = document.getElementById('youtubeUrlInput').value.trim();
                if (!input) {
                    alert('YouTubeのURLまたはビデオIDを入力してください');
                    return;
                }

                const videoId = this.extractVideoId(input);
                if (!videoId) {
                    alert('有効なYouTubeのURLまたはビデオIDを入力してください');
                    return;
                }

                const videoRef = db.ref(`rooms/${currentRoomId}/currentVideo`);
                videoRef.set(videoId);
            },

            extractVideoId(input) {
                // YouTube URLからビデオIDを抽出
                const patterns = [
                    /^([a-zA-Z0-9_-]{11})$/,  // ビデオID直接
                    /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
                    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
                    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/
                ];

                for (let pattern of patterns) {
                    const match = input.match(pattern);
                    if (match) {
                        return match[1];
                    }
                }
                return null;
            },

            updateCommentsFrame(videoId) {
                const commentsFrame = document.getElementById('commentsFrame');
                commentsFrame.src = `https://www.youtube.com/embed/comments?video_id=${videoId}`;
            },

            generateUserId() {
                return `user_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            },

            leaveRoom() {
                if (confirm('ルームから退出しますか？')) {
                    const userRef = db.ref(`rooms/${currentRoomId}/users/${currentUserId}`);
                    userRef.remove();

                    // UIをリセット
                    document.getElementById('roomSelection').style.display = 'flex';
                    document.getElementById('roomView').style.display = 'none';
                    document.getElementById('usernameInput').value = '';
                    document.getElementById('roomIdInput').value = '';

                    currentRoomId = null;
                    currentUsername = null;
                    currentUserId = null;
                }
            },

            deleteAllRooms() {
                if (confirm('⚠️ 本当に全てのルームを削除しますか？この操作は取り消せません。')) {
                    if (confirm('本当に削除しますか？ 確認です。')) {
                        db.ref('rooms').remove().then(() => {
                            alert('全てのルームが削除されました');
                            this.leaveRoom();
                        }).catch((error) => {
                            alert('削除に失敗しました: ' + error.message);
                        });
                    }
                }
            },

            showError(message) {
                const errorEl = document.getElementById('roomSelectionError');
                errorEl.textContent = message;
                setTimeout(() => {
                    errorEl.textContent = '';
                }, 3000);
            }
        };
    </script>
</body>
</html>
