// =============================================
//  Cookie / localStorage 管理
// =============================================
function getCookie(name) {
  const value = `; ${document.cookie}`;
  const parts = value.split(`; ${name}=`);
  if (parts.length === 2) return parts.pop().split(';').shift();
  return null;
}

function setCookie(name, value, days = 365) {
  const expires = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString();
  document.cookie = `${name}=${value}; expires=${expires}; path=/; SameSite=Lax`;
}

function getSavedUid() {
  const cookieUid = getCookie('petUserUid');
  if (cookieUid) return cookieUid;
  const localUid = localStorage.getItem('petUserUid');
  if (localUid) {
    setCookie('petUserUid', localUid);
    return localUid;
  }
  return null;
}

function saveUid(uid) {
  localStorage.setItem('petUserUid', uid);
  setCookie('petUserUid', uid);
}

function autoLogin() {
  const savedUid = getSavedUid();
  if (savedUid) {
    console.log('🔑 保存されたUIDでログイン:', savedUid);
    if (!auth.currentUser) {
      auth.signInAnonymously().catch(error => {
        console.error('ログインエラー:', error);
      });
    }
    return true;
  } else {
    console.log('🆕 新規ログイン');
    auth.signInAnonymously().catch(error => {
      console.error('ログインエラー:', error);
    });
    return false;
  }
}

// =============================================
//  寿命表示
// =============================================
function formatLifeTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatTimeShort(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  if (h > 0) return `${h}時間${m}分${s}秒`;
  else if (m > 0) return `${m}分${s}秒`;
  else return `${s}秒`;
}

// =============================================
//  ペット変更制限
// =============================================
function getRemainingCooldown() {
  const elapsed = Date.now() - lastCharChangeTime;
  const remaining = COOLDOWN_MS - elapsed;
  return Math.max(0, remaining);
}

function canChangePet() {
  if (isDead) return false;
  return getRemainingCooldown() <= 0;
}

function updateChangeLimitDisplay() {
  if (isDead) {
    changeLimitLabel.textContent = '死亡中は変更できません';
    changeLimitLabel.style.color = '#dc3545';
    setCharBtn.disabled = true;
    charInput.disabled = true;
    return;
  }
  const remaining = getRemainingCooldown();
  if (remaining <= 0) {
    changeLimitLabel.textContent = '✅ 変更可能です';
    changeLimitLabel.style.color = '#2ecc71';
    setCharBtn.disabled = false;
    charInput.disabled = false;
  } else {
    const days = Math.floor(remaining / (24 * 60 * 60 * 1000));
    const hours = Math.floor((remaining % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
    changeLimitLabel.textContent = `⏳ 変更可能まであと ${days}日 ${hours}時間`;
    changeLimitLabel.style.color = '#f5a623';
    setCharBtn.disabled = true;
    charInput.disabled = true;
  }
}

function scheduleRankingUpdate() {

  setTimeout(() => {
    isRankingUpdateScheduled = false;
    updateRankingInFirestore();
  }, 3000);
}

async function updateRankingInFirestore() {
  if (!myUid) return;
  if (isDead) return;
  if (currentUser === 'ゲスト' || !currentUser || currentUser.trim() === '') return;
  
  try {
    const snapshot = await db.collection('rankings').where('userId', '==', myUid).get();
    if (!snapshot.empty) {
      const doc = snapshot.docs[0];
      await doc.ref.update({
        currentLife: currentLifeSeconds,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  } catch (error) {
    console.error('ランキング更新エラー:', error);
  }
}

// =============================================
//  寿命減少処理
// =============================================
function startLifeDecrease() {
  if (lifeDecreaseInterval) return;
  if (isDead) return;
  if (isRunning) return;

  lifeDecreaseInterval = setInterval(() => {
    if (currentLifeSeconds > 0 && !isRunning && !isDead) {
      currentLifeSeconds--;
      updatePet();
      scheduleRankingUpdate();
      if (currentLifeSeconds <= 0) {
        currentLifeSeconds = 0;
        clearInterval(lifeDecreaseInterval);
        lifeDecreaseInterval = null;
        setDead();
      }
    }
  }, 1000);
}

function stopLifeDecrease() {
  if (lifeDecreaseInterval) {
    clearInterval(lifeDecreaseInterval);
    lifeDecreaseInterval = null;
  }
}

}

// =============================================
//  スマホ裏返し検知
// =============================================
function initOrientationSensor() {
  if (typeof DeviceOrientationEvent !== 'undefined' && 
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    document.addEventListener('click', function iOSPermission() {
      DeviceOrientationEvent.requestPermission()
        .then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            document.removeEventListener('click', iOSPermission);
          }
        })
        .catch(console.error);
    });
  } else {
    window.addEventListener('deviceorientation', handleOrientation);
  }
}

function handleOrientation(event) {
  const gamma = event.gamma || 0;
  const beta = event.beta || 0;
  const isFlipped = Math.abs(gamma) > 50 || Math.abs(beta) > 120;

  if (isFlipped !== isPhoneFlipped) {
    isPhoneFlipped = isFlipped;
    if (isPhoneFlipped && isStudyMode && !isRunning && !isDead) {
      startStudyTimer();
    } else if (!isPhoneFlipped && isRunning) {
      stopStudyTimer();
    }
  }
}

// =============================================
//  勉強タイマー制御
// =============================================
function startStudyTimer() {
  if (isRunning) return;
  if (isDead) {
    studyStatus.innerHTML = 'ペットが死亡しています。';
    return;
  }
  if (!currentChar || currentChar.trim() === '') {
    studyStatus.innerHTML = 'ペットの名前を設定してください';
    return;
  }

  stopLifeDecrease();

  isRunning = true;
  startTime = Date.now();
  studyStartBtn.disabled = true;
  studyStopBtn.disabled = false;
  studyTimer.classList.add('running');
  studyStatus.innerHTML = '勉強中！ スマホを戻すと終了';

  timerInterval = setInterval(() => {
    const diff = (Date.now() - startTime) / 1000;
    updateStudyTimer(diff);
  }, 200);
}

function stopStudyTimer() {
  if (!isRunning) return;

  isRunning = false;
  clearInterval(timerInterval);
  timerInterval = null;
  studyStartBtn.disabled = false;
  studyStopBtn.disabled = true;
  studyTimer.classList.remove('running');

  const elapsed = (Date.now() - startTime) / 1000;
  updateStudyTimer(elapsed);

  if (elapsed < 1) {
    studyStatus.innerHTML = '短すぎます。もう一度伏せてください';
    studyResult.innerHTML = '1秒未満のため寿命は延びませんでした';
    if (!isDead) startLifeDecrease();
    return;
  }

  const addSeconds = Math.floor(elapsed);
  currentLifeSeconds += addSeconds;
  updatePet();

  addRankingLocal(elapsed, currentChar, currentUser);
  saveRankingOnline(currentUser, currentChar, elapsed);

  const timeStr = formatTimeShort(elapsed);
  
  studyResult.innerHTML = `
    勉強時間: <strong>${timeStr}</strong><br>
    「${currentChar}」の寿命が <span class="result-life">${addSeconds}秒</span> 延びました<br>
    現在の寿命: <strong>${formatLifeTime(currentLifeSeconds)}</strong>
  `;
  studyStatus.innerHTML = '待機中 — 開始ボタンを押してから伏せてください';

  if (!isDead) startLifeDecrease();
}

function updateStudyTimer(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  studyTimer.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// =============================================
//  ペットアニメーション
// =============================================
let animFrameId = null;
let petX = 50, petY = 50;
let petVx = 1.2, petVy = 0.8;

function startPetAnimation() {
  if (animFrameId) return;
  const rect = petArea.getBoundingClientRect();
  petX = rect.width / 2 - 30;
  petY = rect.height / 2 - 30;

  function movePet() {
    const areaRect = petArea.getBoundingClientRect();
    const w = areaRect.width;
    const h = areaRect.height;

    petX += petVx;
    petY += petVy;

    const charWidth = Math.min(petChar.scrollWidth || 60, w * 0.5);
    const charHeight = Math.min(petChar.scrollHeight || 60, h * 0.5);

    if (petX <= 0) { petX = 0; petVx = Math.abs(petVx); }
    if (petX + charWidth >= w) { petX = w - charWidth; petVx = -Math.abs(petVx); }
    if (petY <= 0) { petY = 0; petVy = Math.abs(petVy); }
    if (petY + charHeight >= h) { petY = h - charHeight; petVy = -Math.abs(petVy); }

    petChar.style.left = petX + 'px';
    petChar.style.top = petY + 'px';

    animFrameId = requestAnimationFrame(movePet);
  }
  movePet();
}

function resizePet() {
  const rect = petArea.getBoundingClientRect();
  const charWidth = petChar.scrollWidth || 60;
  const charHeight = petChar.scrollHeight || 60;
  if (petX + charWidth > rect.width) petX = rect.width - charWidth;
  if (petY + charHeight > rect.height) petY = rect.height - charHeight;
  if (petX < 0) petX = 0;
  if (petY < 0) petY = 0;
  petChar.style.left = petX + 'px';
  petChar.style.top = petY + 'px';
}
window.addEventListener('resize', resizePet);

// =============================================
//  ペット成長
// =============================================
function checkGrowth() {
  if (isDead) return;
  const now = Date.now();
  const elapsed = now - lastGrowthCheck;
  const twelveHours = 12 * 60 * 60 * 1000;

  if (elapsed >= twelveHours) {
    const growthAmount = Math.floor(elapsed / twelveHours);
    for (let i = 0; i < growthAmount; i++) {
      petSize = Math.min(petSize + 4, 150);
      growthLevel++;
    }
    lastGrowthCheck = now;
    
    localStorage.setItem('petSize', String(petSize));
    localStorage.setItem('growthLevel', String(growthLevel));
    localStorage.setItem('lastGrowthCheck', String(lastGrowthCheck));
    
    updatePet();
    resizePet();
  }
}
setInterval(checkGrowth, 60 * 1000);

// =============================================
async function checkUserNameUnique(name) {
  if (!name || name === 'ゲスト') return true;
  try {
    const snapshot = await db.collection('rankings').where('userName', '==', name).get();
    let isUnique = true;
    snapshot.forEach(doc => {
      if (doc.data().userId !== myUid) isUnique = false;
    });
    return isUnique;
  } catch (error) {
    console.error('重複チェックエラー:', error);
    return false;
  }
}

async function saveUserNameToFirestore(name) {
  if (!myUid) {
    userStatus.textContent = 'ログインしていません';
    return false;
  }
  if (name === 'ゲスト' || !name || name.trim() === '') {
    userStatus.textContent = 'ゲストはランキングに表示されません';
    userStatus.className = 'status-msg';
    return true;
  }
  try {
    const snapshot = await db.collection('rankings').where('userId', '==', myUid).get();
    if (!snapshot.empty) {
      await snapshot.docs[0].ref.update({
        userName: name,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      await db.collection('rankings').add({
        userId: myUid,
        userName: name,
        petChar: currentChar || 'たま',
        totalSeconds: 0,
        currentLife: currentLifeSeconds,
        isDead: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    return true;
  } catch (error) {
    console.error('保存エラー:', error);
    userStatus.textContent = '保存失敗';
    return false;
  }
}

// =============================================
//  ★ 自動クリーンアップ（エラー修正版） ★
// =============================================
async function autoCleanup() {
  console.log('🧹 自動クリーンアップ開始...');
  
  try {
    let deletedCount = 0;
    let lastDoc = null;
    let hasMore = true;

    while (hasMore) {
      try {
        let query = db.collection('rankings')
          .orderBy('__name__')
          .limit(100);
        
        if (lastDoc) {
          query = query.startAfter(lastDoc);
        }

        const snapshot = await query.get();

        if (snapshot.empty) {
          hasMore = false;
          break;
        }

        const batch = db.batch();
        let batchCount = 0;

        for (const doc of snapshot.docs) {
          const data = doc.data();
          const userId = data.userId || '';
          const userName = data.userName || '';

          let shouldDelete = false;

          // ★ 削除条件（1週間更新なしは削除しない）
          if (!userId) {
            // userIdがないデータは削除（古い形式）
            shouldDelete = true;
          } else if (userName === 'ゲスト' || userName.trim() === '') {
            // ゲストユーザーのデータは削除
            shouldDelete = true;
          }
          // ★ 1週間更新なしのデータは削除しない（維持）

          if (shouldDelete) {
            batch.delete(doc.ref);
            deletedCount++;
            batchCount++;
          }
        }

        if (batchCount > 0) {
          await batch.commit();
          console.log(`🧹 ${batchCount}件削除しました (累計: ${deletedCount}件)`);
        }

        lastDoc = snapshot.docs[snapshot.docs.length - 1];
        
        if (snapshot.docs.length < 100) {
          hasMore = false;
        }

      } catch (batchError) {
        console.warn('バッチ処理エラー（続行）:', batchError.message);
        // エラーがあっても続行
        break;
      }
    }

    console.log(`🧹 クリーンアップ完了: ${deletedCount}件削除`);
    return deletedCount;

  } catch (error) {
    console.error('❌ クリーンアップエラー:', error);
    return 0;
  }
}

// ★ 1時間ごとに自動クリーンアップ
setInterval(() => {
  autoCleanup();
}, 60 * 60 * 1000);

// ★ 起動時にも実行（認証後に実行）
setTimeout(() => {
  autoCleanup();
}, 5000);

// =============================================
//  リアルタイムランキング（ゲスト除外）
// =============================================
function startRealtimeRanking() {
  if (rankUnsubscribe) {
    rankUnsubscribe();
    rankUnsubscribe = null;
  }

  updateInfo.textContent = '🔄 リアルタイム接続中...';

  rankUnsubscribe = db.collection('rankings')
    .orderBy('currentLife', 'desc')
    .limit(50)
    .onSnapshot((snapshot) => {
      let filteredData = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        const userName = data.userName || '';
        const userId = data.userId || '';
        
        if (userName === 'ゲスト' || userName.trim() === '') return;
        if (!userId) return;
        
        filteredData.push({ id: doc.id, ...data });
      });

      filteredData = filteredData.slice(0, 30);

      if (filteredData.length === 0) {
        rankList.innerHTML = `<div class="rank-empty">まだ記録がありません<br>名前を設定してランキングに挑戦！</div>`;
        updateInfo.textContent = '📊 データなし（ゲストは非表示）';
        return;
      }

      let html = '';
      let rank = 0;
      filteredData.forEach(item => {
        const currentLife = item.currentLife || 0;
        const displayTime = formatLifeTime(currentLife);
        const isDeadRank = item.isDead || false;
        
        const medal = rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : `${rank+1}.`;
        const medalClass = rank === 0 ? 'gold' : rank === 1 ? 'silver' : rank === 2 ? 'bronze' : '';
        const topClass = rank < 3 ? `top${rank+1}` : '';
        
        const displayName = item.userName || 'ゲスト';
        const petDisplay = item.petChar || '?';
        const deadMark = isDeadRank ? ' †' : '';
        
        html += `<div class="rank-item ${topClass} ${isDeadRank ? 'dead-rank' : ''}">
          <span class="rank-num ${medalClass}">${medal}</span>
          <span class="rank-user">${displayName}${deadMark}</span>
          <span class="rank-pet">（<span>${petDisplay}</span>）</span>
          <span class="rank-time">${displayTime}</span>
        </div>`;
        rank++;
      });

      rankList.innerHTML = html;
      
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      updateInfo.textContent = `🟢 リアルタイム更新中（${filteredData.length}人） • ${timeStr}`;
      
    }, (error) => {
      console.error('ランキング監視エラー:', error);
      rankList.innerHTML = `<div class="rank-empty">⚠ 読み込みエラー</div>`;
      updateInfo.textContent = '⚠ 接続エラー';
    });
}

// =============================================
//  ランキング保存（ゲストは保存しない）
// =============================================
async function saveRankingOnline(user, char, seconds) {
  if (!myUid) {
    console.log('未ログインのためオンライン保存スキップ');
    return;
  }
  
  if (user === 'ゲスト' || !user || user.trim() === '') {
    console.log('ゲストはランキングに保存しません');
    return;
  }

  try {
    const snapshot = await db.collection('rankings').where('userId', '==', myUid).get();
    const currentLife = currentLifeSeconds;

    if (!snapshot.empty) {
      const doc = snapshot.docs[0];
      await doc.ref.update({
        currentLife: currentLife,
        userName: user,
        petChar: char,
        isDead: isDead,
        totalSeconds: firebase.firestore.FieldValue.increment(seconds),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      console.log('✅ ランキング更新完了');
    } else {
      await db.collection('rankings').add({
        userId: myUid,
        userName: user,
        petChar: char,
        totalSeconds: seconds,
        currentLife: currentLife,
        isDead: isDead,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      console.log('✅ ランキング新規保存完了');
    }
  } catch (error) {
    console.error('保存エラー:', error);
  }
}

    return;
  }

  if (!confirm('⚠️ 本当にアカウントを削除しますか？\n\nこの操作は取り消せません！\n・すべてのデータが完全に削除されます\n・ランキングからも消去されます')) {
    return;
  }

  if (!confirm('🔥 最終確認：アカウントを完全に削除しますか？\n\nペットのデータも全て失われます。')) {
    return;
  }

  deleteAccountBtn.disabled = true;
  deleteAccountBtn.textContent = '⏳ 削除中...';
  deleteStatus.textContent = '処理中...';
  deleteStatus.className = 'status-msg';

  try {
    const snapshot = await db.collection('rankings').where('userId', '==', myUid).get();
    const batch = db.batch();
    snapshot.forEach(doc => {
      batch.delete(doc.ref);
    });
    await batch.commit();
    console.log('✅ Firestoreデータ削除完了');

    const keys = [
      'charPetUser', 'charPetChar', 'charPetLifeSeconds',
      'petSize', 'growthLevel', 'lastGrowthCheck',
      'charPetDead', 'lastCharChangeTime', 'charPetRanking',
      'petUserUid'
    ];
    keys.forEach(key => localStorage.removeItem(key));
    console.log('✅ localStorage削除完了');

    document.cookie = 'petUserUid=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    console.log('✅ Cookie削除完了');

    const user = auth.currentUser;
    if (user) {
      try {
        await user.delete();
        console.log('✅ Firebase認証削除完了');
      } catch (authError) {
        if (authError.code === 'auth/requires-recent-login') {
          await auth.signOut();
          await auth.signInAnonymously();
          const newUser = auth.currentUser;
          if (newUser) await newUser.delete();
        } else {
          throw authError;
        }
      }
    }

    deleteStatus.textContent = '✅ 全てのデータが削除されました。ページをリロードします...';
    deleteStatus.className = 'status-msg success';

    setTimeout(() => {
      location.reload();
    }, 2500);

  } catch (error) {
    console.error('❌ 削除エラー:', error);
    deleteStatus.textContent = '❌ 削除エラー: ' + error.message;
    deleteStatus.className = 'status-msg';
    deleteAccountBtn.disabled = false;
    deleteAccountBtn.textContent = '🗑 アカウント削除（データ完全消去）';
  }
}

deleteAccountBtn.addEventListener('click', deleteAccount);

// =============================================
//  ペット更新
// =============================================
function updatePet() {
  if (isDead) return;
  
  petChar.textContent = currentChar || 'たま';
  lifeSpan.textContent = formatLifeTime(currentLifeSeconds);
  headerUser.textContent = currentUser || 'ゲスト';
  growthLevelEl.textContent = growthLevel;
  
  if (currentLifeSeconds < 600) {
    lifeSpan.classList.add('danger');
  } else {
    lifeSpan.classList.remove('danger');
  }
  
  const charCount = currentChar.length;
  let adjustedSize = petSize;
  if (charCount >= 5) adjustedSize = petSize * 0.55;
  else if (charCount >= 4) adjustedSize = petSize * 0.65;
  else if (charCount >= 3) adjustedSize = petSize * 0.75;
  else if (charCount >= 2) adjustedSize = petSize * 0.85;
  
  petChar.style.fontSize = adjustedSize + 'px';
  
  const ratio = Math.min(currentLifeSeconds / (500 * 3600), 1);
  const r = 255;
  const g = Math.floor(150 + 80 * ratio);
  const b = Math.floor(100 - 50 * ratio);
  petChar.style.color = `rgb(${r}, ${g}, ${b})`;
  petChar.style.textShadow = `0 4px 30px rgba(255, 107, 107, ${0.1 + 0.2 * ratio})`;
}

// =============================================
//  ローカルランキング
// =============================================
function getRankingLocal() {
  try { return JSON.parse(localStorage.getItem('charPetRanking')) || []; }
  catch { return []; }
}
function saveRankingLocal(rank) {
  localStorage.setItem('charPetRanking', JSON.stringify(rank));
}
function addRankingLocal(seconds, char, user) {
  if (seconds < 1) return;
  if (user === 'ゲスト' || !user || user.trim() === '') return;
  
  let rank = getRankingLocal();
  const existing = rank.find(r => r.user === user && r.char === char);
  if (existing) {
    existing.totalSeconds += seconds;
    existing.currentLife = currentLifeSeconds;
  } else {
    rank.push({ 
      user: user || 'ゲスト', 
      char: char || '?', 
      totalSeconds: seconds,
      currentLife: currentLifeSeconds
    });
  }
  rank.sort((a, b) => (b.currentLife || 0) - (a.currentLife || 0));
  if (rank.length > 50) rank = rank.slice(0, 50);
  saveRankingLocal(rank);
}

// =============================================
//  設定
// =============================================
setCharBtn.addEventListener('click', () => {
  if (isDead) {
    charChangeStatus.textContent = '死亡中は変更できません';
    charChangeStatus.className = 'status-msg';
    return;
  }
  
  if (!canChangePet()) {
    const remaining = getRemainingCooldown();
    const days = Math.floor(remaining / (24 * 60 * 60 * 1000));
    const hours = Math.floor((remaining % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
    charChangeStatus.textContent = `変更できません。あと ${days}日 ${hours}時間待ってください`;
    charChangeStatus.className = 'status-msg';
    return;
  }
  
  const newChar = charInput.value.trim();
  if (!newChar || newChar.length === 0) {
    charChangeStatus.textContent = 'ペットの名前を入力してください！';
    charChangeStatus.className = 'status-msg';
    return;
  }
  if (newChar.length > 6) {
    charChangeStatus.textContent = '6文字以内で入力してください！';
    charChangeStatus.className = 'status-msg';
    return;
  }
  
  currentChar = newChar;
  lastCharChangeTime = Date.now();
  localStorage.setItem('lastCharChangeTime', String(lastCharChangeTime));
  localStorage.setItem('charPetChar', currentChar);
  
  updatePet();
  updateChangeLimitDisplay();
  charInput.value = currentChar;
  
  charChangeStatus.textContent = `「${currentChar}」に変更しました！ 次回は3日後から可能です`;
  charChangeStatus.className = 'status-msg success';
  setTimeout(() => { charChangeStatus.textContent = ''; }, 4000);
});

charInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') setCharBtn.click();
});

resetRankBtn.addEventListener('click', () => {
  if (confirm('ローカルランキングをリセットしますか？')) {
    localStorage.removeItem('charPetRanking');
    alert('ローカルランキングをリセットしました');
  }
});

// =============================================
//  初期化
// =============================================
const savedUser = localStorage.getItem('charPetUser');
if (savedUser) {
  currentUser = savedUser;
  userNameInput.value = savedUser;
}
const savedChar = localStorage.getItem('charPetChar');
if (savedChar && savedChar.length > 0 && savedChar.length <= 6) {
  currentChar = savedChar;
  charInput.value = savedChar;
}
const savedLife = localStorage.getItem('charPetLifeSeconds');
if (savedLife) {
  currentLifeSeconds = parseInt(savedLife) || 36 * 3600;
}
const savedSize = localStorage.getItem('petSize');
if (savedSize) {
  petSize = parseFloat(savedSize) || 40;
}
const savedGrowth = localStorage.getItem('growthLevel');
if (savedGrowth) {
  growthLevel = parseInt(savedGrowth) || 1;
}
const savedLastCheck = localStorage.getItem('lastGrowthCheck');
if (savedLastCheck) {
  lastGrowthCheck = parseInt(savedLastCheck) || Date.now();
}
const savedDead = localStorage.getItem('charPetDead');
if (savedDead === 'true') {
  setTimeout(() => { setDead(); }, 500);
}

const savedLastChange = localStorage.getItem('lastCharChangeTime');
if (savedLastChange) {
  lastCharChangeTime = parseInt(savedLastChange) || 0;
} else {
  lastCharChangeTime = 0;
}

initOrientationSensor();
checkGrowth();
updatePet();
updateChangeLimitDisplay();

if (!isDead) {
  setTimeout(() => { startLifeDecrease(); }, 1000);
}

setTimeout(() => {
  startPetAnimation();
  resizePet();
}, 100);

setInterval(() => {
  if (!isDead) {
    localStorage.setItem('charPetLifeSeconds', String(currentLifeSeconds));
    localStorage.setItem('petSize', String(petSize));
    localStorage.setItem('growthLevel', String(growthLevel));
  }
  updateChangeLimitDisplay();
}, 60000);
</script>
