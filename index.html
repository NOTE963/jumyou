<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 YouTube同時視聴</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a1a;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
  }
  .container {
    background: #141428;
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    width: 100%;
    max-width: 560px;
    padding: 24px 20px 30px;
  }
  h1 {
    font-size: 1.4rem;
    text-align: center;
    color: #ff6b6b;
    margin-bottom: 16px;
  }
  .input-area {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .input-area input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 30px;
    border: 2px solid #2a2a4a;
    background: #0f0f26;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
  }
  .input-area input:focus {
    border-color: #ff6b6b;
  }
  .input-area button {
    padding: 10px 20px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: #4a2a3a;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  .input-area button:hover {
    transform: scale(1.03);
  }
  .input-area button:disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  #player {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: #aaa;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .status .badge {
    background: #2ecc71;
    color: #fff;
    padding: 2px 12px;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: 700;
  }
  .status .badge.offline {
    background: #ff6b6b;
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .controls button {
    padding: 10px 24px;
    border: none;
    border-radius: 30px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
    background: #2a2a4a;
    color: #fff;
    flex: 1;
    max-width: 120px;
  }
  .controls button:hover {
    background: #3a3a5a;
  }
  .controls button:active {
    transform: scale(0.94);
  }
  .controls button.primary {
    background: #ff6b6b;
    color: #fff;
  }
  .controls button.primary:hover {
    background: #e05555;
  }

  .chat-area {
    background: #0f0f26;
    border-radius: 16px;
    padding: 12px 14px;
    max-height: 150px;
    overflow-y: auto;
    margin-bottom: 10px;
    border: 1px solid #1a1a36;
  }
  .chat-area .msg {
    font-size: 0.8rem;
    color: #ccc;
    padding: 3px 0;
    border-bottom: 1px solid #1a1a36;
  }
  .chat-area .msg .name {
    color: #ff9a9e;
    font-weight: 700;
  }
  .chat-area .msg .time {
    color: #666;
    font-size: 0.6rem;
    margin-left: 8px;
  }
  .chat-area .msg .system {
    color: #ff6b6b;
  }

  .chat-input {
    display: flex;
    gap: 8px;
  }
  .chat-input input {
    flex: 1;
    padding: 8px 14px;
    border-radius: 30px;
    border: 1px solid #2a2a4a;
    background: #0f0f26;
    color: #fff;
    font-size: 0.85rem;
    outline: none;
  }
  .chat-input input:focus {
    border-color: #ff6b6b;
  }
  .chat-input button {
    padding: 8px 16px;
    border: none;
    border-radius: 30px;
    background: #ff6b6b;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .chat-input button:hover {
    background: #e05555;
  }

  .room-info {
    font-size: 0.65rem;
    color: #666;
    text-align: center;
    margin-top: 10px;
    word-break: break-all;
  }
  .room-info a {
    color: #ff9a9e;
    text-decoration: none;
  }

  .copy-btn {
    background: #2a2a4a;
    color: #aaa;
    border: none;
    padding: 4px 12px;
    border-radius: 16px;
    cursor: pointer;
    font-size: 0.7rem;
    margin-left: 6px;
  }
  .copy-btn:hover {
    background: #3a3a5a;
    color: #fff;
  }

  .error-msg {
    background: #ff6b6b22;
    border: 1px solid #ff6b6b;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
    color: #ff6b6b;
    font-size: 0.85rem;
    display: none;
  }
  .error-msg.show {
    display: block;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🎬 YouTube同時視聴</h1>

  <div class="error-msg" id="errorMsg">⚠️ 接続エラーが発生しました。Firebase設定を確認してください。</div>

  <div class="input-area">
    <input type="text" id="videoIdInput" placeholder="動画IDまたはURL" value="dQw4w9WgXcQ">
    <button id="connectBtn">接続</button>
  </div>

  <div id="player"></div>

  <div class="status">
    <span id="roomStatus">⏳ 接続中...</span>
    <span id="viewerCount">👤 0人</span>
    <span class="badge offline" id="syncBadge">⛔ 未接続</span>
  </div>

  <div class="controls">
    <button id="playBtn" class="primary">▶ 再生</button>
    <button id="pauseBtn">⏸ 一時停止</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="msg"><span class="name system">システム</span> 動画を読み込んでいます...</div>
  </div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="メッセージを入力..." maxlength="100">
    <button id="chatSendBtn">送信</button>
  </div>

  <div class="room-info" id="roomInfo">
    🔗 このページを友達と共有してください
  </div>
</div>

<script>
// =============================================
//  Firebase設定（あなたのプロジェクト）
// =============================================
const firebaseConfig = {
  apiKey: "AIzaSyBqDRgzhHOvUcUoV_JHm9zFJ1IS_CA0394",
  authDomain: "jumyou.firebaseapp.com",
  databaseURL: "https://jumyou-default-rtdb.firebaseio.com",
  projectId: "jumyou",
  storageBucket: "jumyou.firebasestorage.app",
  messagingSenderId: "441346887929",
  appId: "1:441346887929:web:0ca3115f8d1f806df49228",
  measurementId: "G-FBZF2NHEC9"
};

// Firebase初期化
let app;
try {
  app = firebase.initializeApp(firebaseConfig);
  console.log('✅ Firebase初期化成功');
} catch (e) {
  console.error('❌ Firebase初期化エラー:', e);
  document.getElementById('errorMsg').textContent = '❌ Firebase初期化エラー: ' + e.message;
  document.getElementById('errorMsg').classList.add('show');
}

const db = firebase.database();

// 接続テスト
const connectedRef = db.ref('.info/connected');
connectedRef.on('value', (snap) => {
  if (snap.val() === true) {
    console.log('✅ Firebase接続成功');
    document.getElementById('roomStatus').textContent = '🟢 接続中';
    document.getElementById('syncBadge').textContent = '🔄 同期中';
    document.getElementById('syncBadge').className = 'badge';
    document.getElementById('errorMsg').classList.remove('show');
  } else {
    console.log('⏳ Firebase接続待機中...');
    document.getElementById('roomStatus').textContent = '⏳ 接続待機中...';
    document.getElementById('syncBadge').textContent = '⛔ 未接続';
    document.getElementById('syncBadge').className = 'badge offline';
  }
});

// =============================================
//  グローバル状態
// =============================================
let player = null;
let roomId = 'default';
let myName = 'ユーザー' + Math.floor(Math.random() * 1000);
let isSyncing = false;
let isReady = false;
let isFirebaseReady = false;

// DOM
const videoIdInput = document.getElementById('videoIdInput');
const connectBtn = document.getElementById('connectBtn');
const roomStatus = document.getElementById('roomStatus');
const viewerCount = document.getElementById('viewerCount');
const syncBadge = document.getElementById('syncBadge');
const chatArea = document.getElementById('chatArea');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');
const roomInfo = document.getElementById('roomInfo');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const errorMsg = document.getElementById('errorMsg');

// =============================================
//  YouTube IFrame API
// =============================================
function onYouTubeIframeAPIReady() {
  console.log('✅ YouTube API Ready');
  isReady = true;
  const defaultId = videoIdInput.value.trim();
  if (defaultId) {
    loadVideo(defaultId);
  }
}

function createPlayer(videoId) {
  if (player) {
    player.destroy();
    player = null;
  }

  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    videoId: videoId,
    playerVars: {
      'autoplay': 0,
      'rel': 0,
      'controls': 0,
      'disablekb': 1,
      'fs': 0,
      'modestbranding': 1,
    },
    events: {
      'onReady': onPlayerReady,
      'onStateChange': onPlayerStateChange,
      'onError': onPlayerError
    }
  });
}

function onPlayerReady(event) {
  console.log('🎬 プレイヤー準備完了');
  addChatMessage('システム', '動画の準備ができました！', 'system');
  syncRoomState();
}

function onPlayerStateChange(event) {
  if (!player) return;
  if (isSyncing) return;
  if (!isFirebaseReady) return;

  const state = event.data;
  const currentTime = player.getCurrentTime();

  const roomRef = db.ref('rooms/' + roomId);
  roomRef.update({
    state: state,
    time: currentTime,
    updatedAt: Date.now()
  }).catch(e => {
    console.warn('状態更新エラー:', e);
  });
}

function onPlayerError(event) {
  console.error('YouTubeエラー:', event.data);
  addChatMessage('システム', '⚠️ 動画の読み込みに失敗しました。IDを確認してください。', 'system');
}

// =============================================
//  Firebase リアルタイム同期
// =============================================
function syncRoomState() {
  if (!db) return;

  const roomRef = db.ref('rooms/' + roomId);

  // 接続人数
  roomRef.child('viewers').on('value', (snapshot) => {
    const count = snapshot.val() || 0;
    viewerCount.textContent = '👤 ' + count + '人';
  });

  // プレイヤー状態
  roomRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data || !player) return;
    if (!player.getCurrentTime) return;

    if (data.updatedAt && data.updatedAt === lastSyncTime) return;

    const state = data.state;
    const time = data.time || 0;

    try {
      const currentTime = player.getCurrentTime();
      const diff = Math.abs(currentTime - time);

      if (diff > 1.0 && time > 0) {
        isSyncing = true;
        player.seekTo(time, true);
        setTimeout(() => { isSyncing = false; }, 500);
      }

      const playerState = player.getPlayerState();
      if (playerState !== state && state !== undefined) {
        isSyncing = true;
        if (state === YT.PlayerState.PLAYING) {
          player.playVideo();
        } else if (state === YT.PlayerState.PAUSED) {
          player.pauseVideo();
        }
        setTimeout(() => { isSyncing = false; }, 500);
      }
    } catch (e) {
      console.warn('同期エラー:', e);
    }
  });

  // オンライン人数管理
  const viewerRef = roomRef.child('viewers');
  viewerRef.transaction((current) => {
    return (current || 0) + 1;
  });

  viewerRef.onDisconnect().transaction((current) => {
    return Math.max(0, (current || 1) - 1);
  });

  // チャット
  roomRef.child('chat').on('child_added', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      addChatMessage(data.name, data.message, data.time);
    }
  });

  isFirebaseReady = true;
}

// =============================================
//  チャット機能
// =============================================
function addChatMessage(name, message, time, type) {
  const div = document.createElement('div');
  div.className = 'msg';
  const timeStr = time ? new Date(time).toLocaleTimeString() : new Date().toLocaleTimeString();
  const nameClass = type === 'system' ? 'system' : '';
  div.innerHTML = `<span class="name ${nameClass}">${name}</span> ${message} <span class="time">${timeStr}</span>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;

  while (chatArea.children.length > 100) {
    chatArea.removeChild(chatArea.firstChild);
  }
}

function sendChatMessage() {
  const msg = chatInput.value.trim();
  if (!msg) return;
  if (!isFirebaseReady) {
    alert('Firebaseに接続されていません。ページをリロードしてください。');
    return;
  }

  const roomRef = db.ref('rooms/' + roomId + '/chat');
  roomRef.push({
    name: myName,
    message: msg,
    time: Date.now()
  });

  chatInput.value = '';
}

// =============================================
//  動画読み込み
// =============================================
function loadVideo(videoId) {
  if (!videoId) {
    alert('動画IDを入力してください');
    return;
  }

  // URLからID抽出
  let id = videoId;
  if (videoId.includes('watch?v=')) {
    id = videoId.split('watch?v=')[1].split('&')[0];
  } else if (videoId.includes('youtu.be/')) {
    id = videoId.split('youtu.be/')[1].split('?')[0];
  } else if (videoId.includes('v=')) {
    id = videoId.split('v=')[1].split('&')[0];
  }

  if (!isReady) {
    alert('YouTube APIが読み込まれていません。少し待ってから再試行してください。');
    return;
  }

  connectBtn.disabled = true;
  connectBtn.textContent = '読み込み中...';

  createPlayer(id);

  if (isFirebaseReady) {
    const roomRef = db.ref('rooms/' + roomId);
    roomRef.update({
      videoId: id,
      updatedAt: Date.now()
    });
  }

  // 共有URL表示
  const shareUrl = window.location.href.split('?')[0] + '?room=' + encodeURIComponent(roomId);
  roomInfo.innerHTML = `
    🔗 このページを友達と共有してください<br>
    <a href="${shareUrl}" target="_blank">${shareUrl}</a>
    <button class="copy-btn" onclick="copyUrl()">コピー</button>
  `;

  setTimeout(() => {
    connectBtn.disabled = false;
    connectBtn.textContent = '接続';
  }, 3000);
}

// URLコピー機能
function copyUrl() {
  const url = roomInfo.querySelector('a')?.href || window.location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      alert('URLをコピーしました！');
    });
  } else {
    const input = document.createElement('input');
    input.value = url;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    alert('URLをコピーしました！');
  }
}

// =============================================
//  イベントリスナー
// =============================================
connectBtn.addEventListener('click', () => {
  loadVideo(videoIdInput.value.trim());
});

videoIdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') connectBtn.click();
});

chatSendBtn.addEventListener('click', sendChatMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatMessage();
});

playBtn.addEventListener('click', () => {
  if (player && player.playVideo) player.playVideo();
});

pauseBtn.addEventListener('click', () => {
  if (player && player.pauseVideo) player.pauseVideo();
});

// =============================================
//  初期化
// =============================================
const urlParams = new URLSearchParams(window.location.search);
const roomParam = urlParams.get('room');
if (roomParam) {
  roomId = roomParam;
}

myName = 'ユーザー' + Math.floor(Math.random() * 1000);

console.log('🎬 同時視聴ブラウザ起動');
console.log('👤 ユーザー名:', myName);
console.log('🏠 部屋ID:', roomId);

// APIが既に読み込まれている場合
if (typeof YT !== 'undefined' && YT.loaded) {
  isReady = true;
  const defaultId = videoIdInput.value.trim();
  if (defaultId) loadVideo(defaultId);
}

// 1秒後にAPIチェック
setTimeout(() => {
  if (!isReady) {
    console.log('⏳ YouTube API読み込み待機中...');
  }
}, 2000);
</script>
</body>
</html>
