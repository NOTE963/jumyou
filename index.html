<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YouTube 同時視聴</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: #0d1a26;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app {
      max-width: 820px;
      width: 100%;
      background: #162b3b;
      border-radius: 28px;
      padding: 24px 20px 28px;
      box-shadow: 0 16px 30px -8px rgba(0, 0, 0, 0.8);
      border: 1px solid #2f4a5e;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .header h1 {
      color: #f0f9ff;
      font-size: 1.2rem;
      font-weight: 600;
    }
    .header .room-info {
      color: #8aacbf;
      font-size: 0.8rem;
      background: #0f1e2b;
      padding: 4px 16px;
      border-radius: 30px;
      border: 1px solid #2f5066;
    }

    /* 名前設定 */
    .name-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
      background: #0f1e2b;
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid #2d4a5e;
    }
    .name-area label {
      color: #b2d3e8;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .name-area input {
      flex: 1;
      min-width: 100px;
      background: #162b3a;
      border: 1px solid #2f5066;
      padding: 6px 14px;
      border-radius: 24px;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }
    .name-area input:focus {
      border-color: #5a9ec9;
    }
    .name-area .btn {
      flex: 0 1 auto;
      padding: 6px 18px;
      min-width: 50px;
      font-size: 0.8rem;
    }

    /* 動画プレーヤー */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #0a1520;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid #2d4a5e;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* コントロール */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }
    .controls .btn {
      flex: 0 1 auto;
      padding: 8px 16px;
      min-width: 56px;
      font-size: 0.82rem;
    }
    .btn-primary {
      background: #3a7da8;
      border-bottom-color: #1d4d6a;
    }
    .btn-secondary {
      background: #4a6a7a;
      border-bottom-color: #2a4a5a;
    }
    .btn-success {
      background: #2a8266;
      border-bottom-color: #18523f;
    }
    .btn-warning {
      background: #c97d2b;
      border-bottom-color: #8a5518;
    }
    .btn-danger {
      background: #b14f4f;
      border-bottom-color: #752f2f;
    }
    .btn:disabled {
      opacity: 0.4;
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0b1e2b;
      pointer-events: none;
    }

    .url-input-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .url-input-area input {
      flex: 1;
      min-width: 160px;
      background: #162b3a;
      border: 1px solid #2f5066;
      padding: 8px 14px;
      border-radius: 24px;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }
    .url-input-area input:focus {
      border-color: #5a9ec9;
    }
    .url-input-area input::placeholder {
      color: #5a7d93;
    }

    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 12px 0;
    }
    .player-tag {
      background: #1a3343;
      padding: 3px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      color: #b3d4e8;
      border: 1px solid #2f5066;
    }
    .player-tag.you {
      border-color: #5a9ec9;
      color: #7bc9a0;
    }

    .room-input-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 6px 0 10px 0;
    }
    .room-input-area input {
      background: #162b3a;
      border: 1px solid #2f5066;
      padding: 8px 14px;
      border-radius: 24px;
      color: white;
      width: 150px;
      outline: none;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .room-input-area input:focus {
      border-color: #5a9ec9;
    }
    .room-input-area input::placeholder {
      text-transform: none;
      letter-spacing: normal;
      font-size: 0.85rem;
    }
    .room-input-area .btn {
      flex: 0 1 auto;
      padding: 8px 16px;
      min-width: 56px;
      font-size: 0.82rem;
    }
    .room-status {
      color: #7b9eb3;
      font-size: 0.75rem;
      min-width: 50px;
    }

    .sync-status {
      color: #8aacbf;
      font-size: 0.78rem;
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .sync-status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .sync-status .dot.green {
      background: #2a8266;
    }
    .sync-status .dot.yellow {
      background: #c97d2b;
    }
    .sync-status .dot.red {
      background: #b14f4f;
    }

    .toast {
      background: #1a3343;
      padding: 8px 16px;
      border-radius: 30px;
      color: #c7e4f5;
      text-align: center;
      font-weight: 500;
      border-left: 4px solid #4f9bc9;
      margin: 10px 0 4px;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .footer {
      text-align: right;
      color: #5a7d93;
      font-size: 0.6rem;
      margin-top: 10px;
      opacity: 0.5;
    }

    @media (max-width: 500px) {
      .app {
        padding: 14px 10px;
      }
      .header h1 {
        font-size: 1.0rem;
      }
      .room-input-area input {
        width: 90px;
        font-size: 0.85rem;
      }
      .controls .btn {
        font-size: 0.7rem;
        padding: 6px 10px;
        min-width: 44px;
      }
      .url-input-area input {
        font-size: 0.8rem;
        padding: 6px 10px;
        min-width: 120px;
      }
      .name-area {
        padding: 6px 10px;
      }
      .name-area input {
        font-size: 0.8rem;
        padding: 4px 10px;
        min-width: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>▶ YouTube 同時視聴</h1>
      <span class="room-info" id="roomInfo">ルーム: -</span>
    </div>

    <!-- 名前設定 -->
    <div class="name-area">
      <label>👤 名前</label>
      <input type="text" id="usernameInput" placeholder="名前を入力" maxlength="16" />
      <button class="btn btn-primary" id="setNameBtn">設定</button>
    </div>

    <!-- ルーム操作 -->
    <div class="room-input-area">
      <span style="color:#8aacbf; font-size:0.85rem;">ルームID:</span>
      <input type="text" id="roomIdInput" placeholder="自由に設定" maxlength="20" />
      <button class="btn btn-primary" id="createRoomBtn">作成</button>
      <button class="btn btn-secondary" id="joinRoomBtn">参加</button>
      <span class="room-status" id="roomStatus">-</span>
    </div>

    <!-- プレイヤーリスト -->
    <div class="player-list" id="playerList"></div>

    <!-- URL入力 -->
    <div class="url-input-area">
      <input type="text" id="videoUrlInput" placeholder="YouTube URL を入力" />
      <button class="btn btn-success" id="loadVideoBtn">読み込み</button>
      <button class="btn btn-warning" id="syncBtn">同期</button>
    </div>

    <!-- 動画プレーヤー -->
    <div class="video-wrapper">
      <div id="player"></div>
    </div>

    <!-- コントロール -->
    <div class="controls">
      <button class="btn btn-primary" id="playBtn">▶ 再生</button>
      <button class="btn btn-warning" id="pauseBtn">⏸ 一時停止</button>
      <button class="btn btn-secondary" id="stopBtn">⏹ 停止</button>
    </div>

    <!-- 同期状態 -->
    <div class="sync-status">
      <span><span class="dot green" id="statusDot"></span><span id="statusText">待機中</span></span>
      <span id="currentTimeDisplay">0:00</span>
      <span style="color:#5a7d93;">|</span>
      <span id="playerStatus">未読み込み</span>
    </div>

    <div class="toast" id="toastMessage">名前を設定してルームを作成または参加してください</div>
    <div class="footer">Firebase Realtime DB · 同時視聴</div>
  </div>

  <script>
    // ============================================================
    //  Firebase 設定
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBqDRgzhHOvUcUoV_JHm9zFJ1IS_CA0394",
      authDomain: "jumyou.firebaseapp.com",
      databaseURL: "https://jumyou-default-rtdb.firebaseio.com",
      projectId: "jumyou",
      storageBucket: "jumyou.firebasestorage.app",
      messagingSenderId: "441346887929",
      appId: "1:441346887929:web:0ca3115f8d1f806df49228",
      measurementId: "G-FBZF2NHEC9"
    };

    let db = null;
    let roomRef = null;
    let roomListener = null;
    let roomId = null;
    let username = '';
    let player = null;
    let isSyncing = false;
    let isPlaying = false;
    let currentVideoId = '';
    let isPlayerReady = false;

    // ============================================================
    //  DOM 参照
    // ============================================================
    const usernameInput = document.getElementById('usernameInput');
    const setNameBtn = document.getElementById('setNameBtn');
    const roomIdInput = document.getElementById('roomIdInput');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const roomStatus = document.getElementById('roomStatus');
    const roomInfo = document.getElementById('roomInfo');
    const playerList = document.getElementById('playerList');
    const videoUrlInput = document.getElementById('videoUrlInput');
    const loadVideoBtn = document.getElementById('loadVideoBtn');
    const syncBtn = document.getElementById('syncBtn');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const toast = document.getElementById('toastMessage');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const playerStatus = document.getElementById('playerStatus');

    // ============================================================
    //  Cookie 操作
    // ============================================================
    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return m ? decodeURIComponent(m[2]) : null;
    }

    function setCookie(name, value, days = 365) {
      const d = new Date();
      d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
      document.cookie = `${name}=${encodeURIComponent(value)}; expires=${d.toUTCString()}; path=/; SameSite=Lax`;
    }

    // ============================================================
    //  名前管理
    // ============================================================
    function loadUsername() {
      const saved = getCookie('watch_username');
      if (saved) {
        usernameInput.value = saved;
        username = saved;
      } else {
        const guest = 'ゲスト' + Math.floor(Math.random() * 1000);
        usernameInput.value = guest;
        username = guest;
      }
    }

    function setUsername() {
      const name = usernameInput.value.trim();
      if (!name) {
        toastMessage('名前を入力してください');
        return;
      }
      if (name.length > 16) {
        toastMessage('名前は16文字以内にしてください');
        return;
      }
      username = name;
      setCookie('watch_username', name);
      toastMessage(`名前を "${name}" に設定しました`);
      // ルームに参加中の場合は名前を更新
      if (roomId && roomRef) {
        const updates = {};
        updates[`players/${username}`] = { joined: true };
        // 古い名前を削除（以前の名前が残っている場合）
        roomRef.once('value', (snap) => {
          const data = snap.val();
          if (data && data.players) {
            const oldName = Object.keys(data.players).find(n => n !== username && data.players[n]?.joined === true);
            // 簡易的に: 名前変更時は古いエントリを削除（安全のため）
          }
        });
        roomRef.update(updates).catch(() => {});
        // プレイヤーリスト再描画
        roomRef.once('value', (snap) => {
          const data = snap.val();
          if (data) renderPlayerList(data.players || {});
        });
      }
    }

    // ============================================================
    //  YouTube IFrame API
    // ============================================================
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: {
          'playsinline': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    if (typeof YT === 'undefined' || !YT.Player) {
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    } else {
      onYouTubeIframeAPIReady();
    }

    function onPlayerReady(event) {
      isPlayerReady = true;
      playerStatus.textContent = '準備完了';
      toastMessage('プレーヤー準備完了');
      if (roomId && roomRef) {
        roomRef.once('value', (snap) => {
          const data = snap.val();
          if (data && data.videoId) {
            loadVideo(data.videoId, data.currentTime || 0);
          }
        });
      }
    }

    function onPlayerStateChange(event) {
      if (!roomId || !roomRef) return;
      const state = event.data;
      if (!isSyncing) {
        const updates = {};
        if (state === YT.PlayerState.PLAYING) {
          updates['isPlaying'] = true;
          updates['currentTime'] = player.getCurrentTime();
          roomRef.update(updates);
        } else if (state === YT.PlayerState.PAUSED) {
          updates['isPlaying'] = false;
          updates['currentTime'] = player.getCurrentTime();
          roomRef.update(updates);
        } else if (state === YT.PlayerState.ENDED) {
          updates['isPlaying'] = false;
          updates['currentTime'] = 0;
          roomRef.update(updates);
        }
      }
      updateUI();
    }

    function onPlayerError(event) {
      console.error('YouTube エラー:', event.data);
      toastMessage('動画の読み込みに失敗しました');
    }

    // ============================================================
    //  Firebase 接続
    // ============================================================
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      console.log('Firebase 接続成功');
    } catch (e) {
      console.warn('Firebase 初期化エラー', e);
    }

    // ============================================================
    //  トースト
    // ============================================================
    function toastMessage(msg) {
      toast.textContent = msg;
      setTimeout(() => {
        if (toast.textContent === msg) {
          toast.textContent = '名前を設定してルームを作成または参加してください';
        }
      }, 3000);
    }

    // ============================================================
    //  ルーム管理
    // ============================================================
    function createRoom() {
      if (!username) {
        toastMessage('先に名前を設定してください');
        return;
      }
      let id = roomIdInput.value.trim().toUpperCase();
      if (!id) {
        toastMessage('ルームIDを入力してください');
        return;
      }
      id = id.replace(/[^A-Z0-9_]/g, '');
      if (id.length < 1) {
        toastMessage('有効なルームIDを入力してください');
        return;
      }
      roomIdInput.value = id;

      if (!db) {
        toastMessage('Firebaseに接続されていません');
        return;
      }

      const ref = db.ref('watch_rooms/' + id);
      ref.once('value', (snap) => {
        if (snap.exists()) {
          toastMessage('このルームIDは既に使用されています');
          return;
        }
        const roomData = {
          players: { [username]: { joined: true } },
          videoId: '',
          currentTime: 0,
          isPlaying: false,
          creator: username,
          timestamp: Date.now()
        };
        ref.set(roomData).then(() => {
          roomId = id;
          roomRef = ref;
          roomStatus.textContent = `作成: ${id}`;
          roomInfo.textContent = `ルーム: ${id}`;
          toastMessage('ルームを作成しました');
          listenRoom(id);
        }).catch((err) => {
          toastMessage('ルーム作成に失敗: ' + err.message);
        });
      });
    }

    function joinRoom() {
      if (!username) {
        toastMessage('先に名前を設定してください');
        return;
      }
      let id = roomIdInput.value.trim().toUpperCase();
      if (!id) {
        toastMessage('ルームIDを入力してください');
        return;
      }
      id = id.replace(/[^A-Z0-9_]/g, '');
      if (id.length < 1) {
        toastMessage('有効なルームIDを入力してください');
        return;
      }
      roomIdInput.value = id;

      if (!db) {
        toastMessage('Firebaseに接続されていません');
        return;
      }

      const ref = db.ref('watch_rooms/' + id);
      ref.once('value', (snap) => {
        const data = snap.val();
        if (!data) {
          toastMessage('ルームが見つかりません');
          return;
        }
        if (data.players && data.players[username]) {
          toastMessage('この名前は既にルームにいます');
          return;
        }
        const updates = {};
        updates[`players/${username}`] = { joined: true };
        ref.update(updates).then(() => {
          roomId = id;
          roomRef = ref;
          roomStatus.textContent = `参加: ${id}`;
          roomInfo.textContent = `ルーム: ${id}`;
          toastMessage('ルームに参加しました');
          listenRoom(id);
          if (data.videoId && isPlayerReady) {
            loadVideo(data.videoId, data.currentTime || 0);
            if (data.isPlaying) {
              player.playVideo();
            }
          }
        }).catch((err) => {
          toastMessage('参加に失敗: ' + err.message);
        });
      });
    }

    function listenRoom(id) {
      if (roomListener) roomListener.off();
      roomListener = db.ref('watch_rooms/' + id);
      roomListener.on('value', (snap) => {
        const data = snap.val();
        if (!data) {
          toastMessage('ルームが削除されました');
          exitRoom();
          return;
        }

        renderPlayerList(data.players || {});

        if (data.videoId && data.videoId !== currentVideoId && isPlayerReady) {
          loadVideo(data.videoId, data.currentTime || 0);
        }

        if (isPlayerReady && player) {
          isSyncing = true;
          const currentPlayerTime = player.getCurrentTime();
          const targetTime = data.currentTime || 0;
          const timeDiff = Math.abs(currentPlayerTime - targetTime);

          if (data.isPlaying !== isPlaying) {
            if (data.isPlaying) {
              player.playVideo();
            } else {
              player.pauseVideo();
            }
            isPlaying = data.isPlaying;
          } else if (timeDiff > 1.0 && targetTime > 0) {
            player.seekTo(targetTime, true);
          }
          isSyncing = false;
        }

        updateUI();
      });
    }

    function exitRoom() {
      if (roomRef && roomId) {
        const updates = {};
        updates[`players/${username}`] = null;
        roomRef.update(updates).then(() => {
          roomRef.once('value', (snap) => {
            const data = snap.val();
            if (data) {
              const players = data.players || {};
              if (Object.keys(players).length === 0) {
                roomRef.remove().catch(() => {});
              }
            }
          });
        }).catch(() => {});
      }
      if (roomListener) { roomListener.off();
        roomListener = null; }
      roomId = null;
      roomRef = null;
      roomStatus.textContent = '-';
      roomInfo.textContent = 'ルーム: -';
      playerList.innerHTML = '';
      toastMessage('退出しました');
    }

    function renderPlayerList(players) {
      playerList.innerHTML = '';
      if (!players) return;
      const names = Object.keys(players);
      names.forEach(name => {
        const tag = document.createElement('span');
        tag.className = 'player-tag';
        if (name === username) tag.classList.add('you');
        tag.textContent = name;
        playerList.appendChild(tag);
      });
      for (let i = names.length; i < 8; i++) {
        const tag = document.createElement('span');
        tag.className = 'player-tag';
        tag.textContent = '空き';
        tag.style.opacity = '0.3';
        playerList.appendChild(tag);
      }
    }

    // ============================================================
    //  動画操作
    // ============================================================
    function loadVideo(videoId, seekTime = 0) {
      if (!isPlayerReady || !player) return;
      if (!videoId) return;
      currentVideoId = videoId;
      player.loadVideoById(videoId, seekTime);
      playerStatus.textContent = '読み込み中...';
      if (roomRef) {
        roomRef.update({
          videoId: videoId,
          currentTime: seekTime || 0,
          isPlaying: false
        });
      }
    }

    function loadVideoFromUrl() {
      const url = videoUrlInput.value.trim();
      if (!url) {
        toastMessage('YouTube URLを入力してください');
        return;
      }
      const videoId = extractVideoId(url);
      if (!videoId) {
        toastMessage('有効なYouTube URLではありません');
        return;
      }
      if (!roomId) {
        toastMessage('先にルームに参加してください');
        return;
      }
      loadVideo(videoId, 0);
      toastMessage('動画を読み込みました');
      videoUrlInput.value = '';
    }

    function extractVideoId(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=)([^&]+)/,
        /(?:youtu\.be\/)([^?]+)/,
        /(?:youtube\.com\/embed\/)([^?]+)/
      ];
      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      if (/^[A-Za-z0-9_-]{11}$/.test(url)) return url;
      return null;
    }

    function syncVideo() {
      if (!roomId || !roomRef) {
        toastMessage('ルームに参加してください');
        return;
      }
      if (!isPlayerReady || !player) {
        toastMessage('プレーヤーが準備できていません');
        return;
      }
      const currentTime = player.getCurrentTime();
      const isPlayingState = player.getPlayerState() === YT.PlayerState.PLAYING;
      roomRef.update({
        currentTime: currentTime,
        isPlaying: isPlayingState
      }).then(() => {
        toastMessage('同期しました');
      }).catch((err) => {
        toastMessage('同期に失敗: ' + err.message);
      });
    }

    function playVideo() {
      if (!isPlayerReady || !player) return;
      if (!roomId) { toastMessage('ルームに参加してください'); return; }
      player.playVideo();
      roomRef.update({ isPlaying: true });
    }

    function pauseVideo() {
      if (!isPlayerReady || !player) return;
      if (!roomId) { toastMessage('ルームに参加してください'); return; }
      player.pauseVideo();
      roomRef.update({ isPlaying: false });
    }

    function stopVideo() {
      if (!isPlayerReady || !player) return;
      if (!roomId) { toastMessage('ルームに参加してください'); return; }
      player.stopVideo();
      roomRef.update({ isPlaying: false, currentTime: 0 });
      playerStatus.textContent = '停止';
    }

    function updateUI() {
      if (isPlayerReady && player) {
        const state = player.getPlayerState();
        const time = player.getCurrentTime();
        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);
        currentTimeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        const stateMap = {
          [-1]: '未開始',
          [0]: '終了',
          [1]: '再生中',
          [2]: '一時停止',
          [3]: 'バッファリング',
          [5]: '頭出し'
        };
        playerStatus.textContent = stateMap[state] || '不明';
        isPlaying = state === YT.PlayerState.PLAYING;

        if (roomId) {
          statusDot.className = 'dot green';
          statusText.textContent = '同期中';
        } else {
          statusDot.className = 'dot yellow';
          statusText.textContent = '未接続';
        }
      }
    }

    setInterval(updateUI, 500);

    // ============================================================
    //  イベント
    // ============================================================
    setNameBtn.addEventListener('click', setUsername);
    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') setUsername();
    });

    createRoomBtn.addEventListener('click', createRoom);
    joinRoomBtn.addEventListener('click', joinRoom);
    loadVideoBtn.addEventListener('click', loadVideoFromUrl);
    syncBtn.addEventListener('click', syncVideo);
    playBtn.addEventListener('click', playVideo);
    pauseBtn.addEventListener('click', pauseVideo);
    stopBtn.addEventListener('click', stopVideo);

    videoUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadVideoFromUrl();
    });

    roomIdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinRoom();
    });

    // ============================================================
    //  初期化
    // ============================================================
    function init() {
      loadUsername();
      toastMessage('名前を設定してルームを作成または参加してください');
      if (db) {
        db.ref('watch_rooms').once('value', (snap) => {
          const data = snap.val();
          if (data) {
            Object.keys(data).forEach(key => {
              const room = data[key];
              const players = room.players || {};
              if (Object.keys(players).length === 0) {
                db.ref('watch_rooms/' + key).remove().catch(() => {});
              }
            });
          }
        });
      }
    }

    if (typeof YT !== 'undefined' && YT.Player) {
      onYouTubeIframeAPIReady();
    }

    init();
  </script>
</body>
</html>
